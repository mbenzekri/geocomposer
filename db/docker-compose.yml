services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: myproject-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgis:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d