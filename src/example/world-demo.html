<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenLayers Services Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --line: #d7dee8;
      --text: #172033;
      --muted: #5c6b7a;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .meta {
      margin: 12px 0 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar-label {
      font-weight: 700;
      color: var(--text);
    }

    .scale-value {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
    }

    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .segmented button {
      min-width: 96px;
      min-height: 34px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .segmented button:last-child {
      border-right: 0;
    }

    .segmented button[aria-checked="true"] {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .segmented button:disabled {
      color: var(--muted);
      cursor: not-allowed;
      opacity: 0.55;
    }

    .segmented button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .map-shell {
      width: 1000px;
      max-width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    #map {
      width: 100%;
      height: 500px;
    }

    #map .ol-scale-bar {
      left: 12px;
      bottom: 12px;
    }

    .request {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 13px;
      line-height: 1.5;
    }

    .request-url {
      display: block;
      width: 100%;
      margin-top: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .info-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .segmented.compact button {
      min-width: 82px;
    }

    .feature-info-status {
      margin-top: 8px;
      color: var(--muted);
    }

    .feature-info-output {
      display: block;
      width: 100%;
      max-height: 260px;
      margin: 8px 0 0;
      padding: 10px;
      overflow: auto;
      border: 1px solid var(--line);
      background: #f8fafc;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    code {
      font-family: Consolas, Monaco, monospace;
    }
  </style>
</head>
<body>
  <main>
    <h1>GeoComposer OpenLayers</h1>
    <p id="projection-summary">Vue EPSG:3857, WMS, world GeoJSON + capitales GeoJSON, surface 1000 x 500 px.</p>
    <div class="meta"><code id="service-url">http://localhost:3000/wms</code></div>

    <div class="toolbar">
      <span class="toolbar-label">Service</span>
      <div class="segmented" role="radiogroup" aria-label="Service OGC">
        <button type="button" role="radio" aria-checked="true" data-service="wms">WMS</button>
        <button type="button" role="radio" aria-checked="false" data-service="wmts">WMTS</button>
        <button type="button" role="radio" aria-checked="false" data-service="xyz">XYZ</button>
      </div>
    </div>

    <div class="toolbar">
      <span class="toolbar-label">Projection</span>
      <div class="segmented" role="radiogroup" aria-label="Projection">
        <button type="button" role="radio" aria-checked="false" data-projection="EPSG:4326">EPSG:4326</button>
        <button type="button" role="radio" aria-checked="true" data-projection="EPSG:3857">EPSG:3857</button>
      </div>
    </div>

    <div id="format-toolbar" class="toolbar">
      <span class="toolbar-label">Format</span>
      <div class="segmented" role="radiogroup" aria-label="Format de source world">
        <button type="button" role="radio" aria-checked="true" data-world-layer="world" data-format-label="GeoJSON">GeoJSON</button>
        <button type="button" role="radio" aria-checked="false" data-world-layer="world-mem" data-format-label="Memory">MEM</button>
        <button type="button" role="radio" aria-checked="false" data-world-layer="world-gml" data-format-label="GML">GML</button>
        <button type="button" role="radio" aria-checked="false" data-world-layer="world-shp" data-format-label="Shapefile">SHP</button>
        <button type="button" role="radio" aria-checked="false" data-world-layer="world-gpkg" data-format-label="GeoPackage">GPKG</button>
      </div>
    </div>

    <div id="tileset-toolbar" class="toolbar" hidden>
      <span class="toolbar-label">Tileset</span>
      <div class="segmented" role="radiogroup" aria-label="Tileset">
        <button type="button" role="radio" aria-checked="false" data-tileset="world">World</button>
        <button type="button" role="radio" aria-checked="true" data-tileset="world-capitals">World + Capitals</button>
      </div>
    </div>

    <div class="toolbar">
      <span class="toolbar-label">Echelle</span>
      <code id="scale-denominator" class="scale-value">1/...</code>
    </div>

    <div class="map-shell">
      <div id="map" aria-label="Carte du monde"></div>
    </div>

    <div class="request">
      <div><strong>Derniere requete</strong></div>
      <code id="request-url" class="request-url">En attente...</code>
    </div>

    <div class="request">
      <div class="info-header">
        <strong>GetFeatureInfo</strong>
        <div class="segmented compact" role="radiogroup" aria-label="Format GetFeatureInfo">
          <button type="button" role="radio" aria-checked="true" data-info-format="application/geo+json" data-info-format-label="GeoJSON">GeoJSON</button>
          <button type="button" role="radio" aria-checked="false" data-info-format="text/xml" data-info-format-label="XML">XML</button>
        </div>
      </div>
      <div id="feature-info-status" class="feature-info-status">Aucune selection</div>
      <code id="feature-info-url" class="request-url">En attente...</code>
      <pre id="feature-info-output" class="feature-info-output">Aucun resultat</pre>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
  <script>
    const serviceUrls = {
      wms: 'http://localhost:3000/wms',
      wmts: 'http://localhost:3000/wmts',
      xyz: 'http://localhost:3000/tiles'
    }
    const webMercatorMax = 20037508.342789244
    const tileSize = 256
    const tileMinZoom = 0
    const tileMaxZoom = 8
    const tileResolutions = []
    const tileMatrixIds = []
    for (let z = tileMinZoom; z <= tileMaxZoom; z += 1) {
      tileResolutions.push((webMercatorMax * 2) / (tileSize * Math.pow(2, z)))
      tileMatrixIds.push(String(z))
    }
    const projections = {
      'EPSG:4326': {
        center: [0, 0],
        zoom: 1
      },
      'EPSG:3857': {
        center: [0, 0],
        zoom: 1
      }
    }
    const serviceLabels = {
      wms: 'WMS',
      wmts: 'WMTS',
      xyz: 'XYZ'
    }
    const tilesetLabels = {
      world: 'World',
      'world-capitals': 'World + Capitals'
    }
    const projectionSummary = document.getElementById('projection-summary')
    const serviceUrlElement = document.getElementById('service-url')
    const serviceButtons = Array.from(document.querySelectorAll('[data-service]'))
    const projectionButtons = Array.from(document.querySelectorAll('[data-projection]'))
    const formatToolbar = document.getElementById('format-toolbar')
    const formatButtons = Array.from(document.querySelectorAll('[data-world-layer]'))
    const tilesetToolbar = document.getElementById('tileset-toolbar')
    const tilesetButtons = Array.from(document.querySelectorAll('[data-tileset]'))
    const infoFormatButtons = Array.from(document.querySelectorAll('[data-info-format]'))
    const requestUrlElement = document.getElementById('request-url')
    const scaleDenominatorElement = document.getElementById('scale-denominator')
    const featureInfoStatusElement = document.getElementById('feature-info-status')
    const featureInfoUrlElement = document.getElementById('feature-info-url')
    const featureInfoOutputElement = document.getElementById('feature-info-output')
    let lastRequestUrl = ''
    let currentService = 'wms'
    let currentProjectionCode = 'EPSG:3857'
    let currentTileset = 'world-capitals'
    let currentWorldLayer = 'world'
    let currentFormatLabel = 'GeoJSON'
    let currentInfoFormat = 'application/geo+json'
    let currentInfoFormatLabel = 'GeoJSON'
    let lastFeatureInfoCoordinate = null
    let featureInfoAbortController = null
    let pointerDownPixel = null
    let lastMapDragAt = 0
    let sourceVersion = 0
    const featureInfoDragDelayMs = 350
    const featureInfoDragTolerancePx = 4

    let source = createSourceForService(currentService, sourceVersion)
    let layer = createLayerForService(currentService, source)

    const map = new ol.Map({
      target: 'map',
      layers: [layer],
      view: createView(currentProjectionCode)
    })
    map.addControl(new ol.control.ScaleLine({
      units: 'metric',
      bar: true,
      steps: 4,
      text: true,
      minWidth: 140
    }))

    function createSourceForService(service, version) {
      if (service === 'wms') return createWmsSource(version)
      if (service === 'wmts') return createWmtsSource(version)
      return createXyzSource(version)
    }

    function createLayerForService(service, source) {
      if (service === 'wms') {
        return new ol.layer.Image({ source })
      }

      return new ol.layer.Tile({ source })
    }

    function createWmsSource(version) {
      return new ol.source.ImageWMS({
        url: serviceUrls.wms,
        params: {
          SERVICE: 'WMS',
          VERSION: '1.3.0',
          LAYERS: `${currentWorldLayer},capitals`,
          STYLES: 'world,capitals',
          FORMAT: 'image/png',
          TRANSPARENT: true
        },
        ratio: 1,
        serverType: 'mapserver',
        imageLoadFunction: (image, src) => {
          if (!isActiveSource('wms', version)) return

          setLastRequestUrl(src, 'wms', version)
          image.getImage().src = src
        }
      })
    }

    function createXyzSource(version) {
      return new ol.source.XYZ({
        projection: 'EPSG:3857',
        tileSize,
        minZoom: tileMinZoom,
        maxZoom: tileMaxZoom,
        wrapX: false,
        url: `${serviceUrls.xyz}/${encodeURIComponent(currentTileset)}/{z}/{x}/{y}.png`,
        tileLoadFunction: (tile, src) => {
          if (!isActiveSource('xyz', version)) return

          setLastRequestUrl(src, 'xyz', version)
          tile.getImage().src = src
        }
      })
    }

    function createWmtsSource(version) {
      return new ol.source.WMTS({
        url: serviceUrls.wmts,
        layer: currentTileset,
        matrixSet: 'WebMercatorQuad',
        format: 'image/png',
        projection: 'EPSG:3857',
        requestEncoding: 'KVP',
        style: 'default',
        wrapX: false,
        tileGrid: new ol.tilegrid.WMTS({
          origin: [-webMercatorMax, webMercatorMax],
          resolutions: tileResolutions,
          matrixIds: tileMatrixIds
        }),
        tileLoadFunction: (tile, src) => {
          if (!isActiveSource('wmts', version)) return

          setLastRequestUrl(src, 'wmts', version)
          tile.getImage().src = src
        }
      })
    }

    function isActiveSource(service, version) {
      return currentService === service && sourceVersion === version
    }

    function setLastRequestUrl(url, service, version) {
      if (!isActiveSource(service, version)) return

      lastRequestUrl = url
      requestUrlElement.textContent = url
    }

    function replaceMapLayer() {
      sourceVersion += 1
      source = createSourceForService(currentService, sourceVersion)
      const nextLayer = createLayerForService(currentService, source)
      map.getLayers().clear()
      map.addLayer(nextLayer)
      layer = nextLayer
    }

    function createView(code) {
      const projection = projections[code]
      return new ol.View({
        projection: code,
        center: projection.center,
        zoom: projection.zoom,
        multiWorld: true
      })
    }

    function setService(service) {
      if (!service || !serviceUrls[service]) return

      currentService = service
      if (currentService !== 'wms' && currentProjectionCode !== 'EPSG:3857') {
        currentProjectionCode = 'EPSG:3857'
        map.setView(createView(currentProjectionCode))
      }
      lastRequestUrl = ''
      requestUrlElement.textContent = 'En attente...'
      replaceMapLayer()

      syncServiceControls()
      updateProjectionSummary()
      clearFeatureInfo()
      updateScaleReadout()
      updateRequestUrl()
    }

    function setTileset(tileset) {
      if (!tileset || !tilesetLabels[tileset]) return

      currentTileset = tileset
      for (const button of tilesetButtons) {
        const selected = button.dataset.tileset === tileset
        button.setAttribute('aria-checked', String(selected))
      }

      if (currentService !== 'wms') {
        lastRequestUrl = ''
        requestUrlElement.textContent = 'En attente...'
        replaceMapLayer()
        updateProjectionSummary()
        updateRequestUrl()
      }

    }

    function setProjection(code) {
      if (!projections[code]) return
      if (currentService !== 'wms' && code !== 'EPSG:3857') return

      currentProjectionCode = code
      lastRequestUrl = ''
      requestUrlElement.textContent = 'En attente...'
      map.setView(createView(currentProjectionCode))

      if (currentService === 'wms') {
        replaceMapLayer()
      }

      syncServiceControls()
      updateProjectionSummary()
      clearFeatureInfo()
      updateScaleReadout()
      updateRequestUrl()
    }

    function syncServiceControls() {
      serviceUrlElement.textContent = serviceUrls[currentService]

      for (const button of serviceButtons) {
        const selected = button.dataset.service === currentService
        button.setAttribute('aria-checked', String(selected))
      }

      const wmsMode = currentService === 'wms'
      formatToolbar.hidden = !wmsMode
      tilesetToolbar.hidden = wmsMode

      for (const button of projectionButtons) {
        const supported = wmsMode || button.dataset.projection === 'EPSG:3857'
        const selected = button.dataset.projection === currentProjectionCode
        button.disabled = !supported
        button.setAttribute('aria-checked', String(selected))
      }

      for (const button of formatButtons) {
        const selected = button.dataset.worldLayer === currentWorldLayer
        button.setAttribute('aria-checked', String(selected))
      }

      for (const button of tilesetButtons) {
        const selected = button.dataset.tileset === currentTileset
        button.setAttribute('aria-checked', String(selected))
      }
    }

    function setWorldLayer(layerName, formatLabel) {
      if (currentService !== 'wms') return
      if (!layerName) return

      lastRequestUrl = ''
      requestUrlElement.textContent = 'En attente...'
      currentFormatLabel = formatLabel || layerName
      currentWorldLayer = layerName
      source.updateParams({
        LAYERS: `${layerName},capitals`,
        STYLES: 'world,capitals'
      })

      for (const button of formatButtons) {
        const selected = button.dataset.worldLayer === layerName
        button.setAttribute('aria-checked', String(selected))
      }

      updateProjectionSummary()
      clearFeatureInfo()
      updateRequestUrl()
    }

    function setInfoFormat(format, label) {
      if (!format) return

      currentInfoFormat = format
      currentInfoFormatLabel = label || format

      for (const button of infoFormatButtons) {
        const selected = button.dataset.infoFormat === format
        button.setAttribute('aria-checked', String(selected))
      }

      if (lastFeatureInfoCoordinate) {
        requestFeatureInfo(lastFeatureInfoCoordinate)
      }
    }

    function updateProjectionSummary() {
      const content = currentService === 'wms'
        ? `world ${currentFormatLabel} + capitales GeoJSON`
        : `tileset ${tilesetLabels[currentTileset]}`
      projectionSummary.textContent = `Vue ${currentProjectionCode}, ${serviceLabels[currentService]}, ${content}, surface 1000 x 500 px.`
    }

    function updateScaleReadout() {
      const view = map.getView()
      const resolution = view.getResolution()
      const center = view.getCenter()
      const projection = view.getProjection()

      if (resolution === undefined || !center || !projection) {
        scaleDenominatorElement.textContent = '1/...'
        return
      }

      const metersPerPixel = ol.proj.getPointResolution(projection, resolution, center, 'm')
      const denominator = Math.max(1, Math.round(metersPerPixel / 0.00028))
      scaleDenominatorElement.textContent = `1/${denominator.toLocaleString('fr-FR')}`
    }

    function updateRequestUrl() {
      if (currentService !== 'wms') {
        requestUrlElement.textContent = lastRequestUrl || tileRequestTemplate()
        return
      }

      const size = map.getSize()
      if (!size) return

      const extent = map.getView().calculateExtent(size)
      const projection = map.getView().getProjection()

      const image = source.getImage(extent, map.getView().getResolution(), window.devicePixelRatio, projection)
      const imageElement = image && image.getImage ? image.getImage() : null
      const imageUrl = imageElement && imageElement.src ? imageElement.src : lastRequestUrl

      requestUrlElement.textContent = imageUrl || 'En attente...'
    }

    function tileRequestTemplate() {
      if (currentService === 'xyz') {
        return `${serviceUrls.xyz}/${encodeURIComponent(currentTileset)}/{z}/{x}/{y}.png`
      }

      return `${serviceUrls.wmts}?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${encodeURIComponent(currentTileset)}&STYLE=default&TILEMATRIXSET=WebMercatorQuad&TILEMATRIX={TileMatrix}&TILEROW={TileRow}&TILECOL={TileCol}&FORMAT=image/png`
    }

    async function requestFeatureInfo(coordinate) {
      if (currentService !== 'wms') {
        featureInfoStatusElement.textContent = 'GetFeatureInfo disponible uniquement en WMS'
        featureInfoUrlElement.textContent = 'En attente...'
        featureInfoOutputElement.textContent = 'Aucun resultat'
        return
      }

      const view = map.getView()
      const resolution = view.getResolution()
      const projection = view.getProjection()
      const layers = source.getParams().LAYERS

      if (resolution === undefined || !layers) return

      const url = source.getFeatureInfoUrl(coordinate, resolution, projection, {
        INFO_FORMAT: currentInfoFormat,
        QUERY_LAYERS: layers,
        FEATURE_COUNT: 10,
        BUFFER: 6
      })

      if (!url) return

      lastFeatureInfoCoordinate = coordinate.slice()
      if (featureInfoAbortController) {
        featureInfoAbortController.abort()
      }
      featureInfoAbortController = new AbortController()

      featureInfoStatusElement.textContent = `Requete ${currentInfoFormatLabel}...`
      featureInfoUrlElement.textContent = url
      featureInfoOutputElement.textContent = 'En attente...'

      try {
        const response = await fetch(url, {
          headers: {
            Accept: currentInfoFormat
          },
          signal: featureInfoAbortController.signal
        })
        const body = await response.text()

        if (!response.ok) {
          throw new Error(body || `${response.status} ${response.statusText}`)
        }

        renderFeatureInfo(body)
      } catch (error) {
        if (error && error.name === 'AbortError') return

        featureInfoStatusElement.textContent = 'Echec de la requete GetFeatureInfo'
        featureInfoOutputElement.textContent = error instanceof Error ? error.message : String(error)
      }
    }

    function abortFeatureInfoRequest() {
      if (!featureInfoAbortController) return

      featureInfoAbortController.abort()
      featureInfoAbortController = null
    }

    function handleMapPointerDown(event) {
      pointerDownPixel = event.pixel ? event.pixel.slice() : null
    }

    function handleMapPointerDrag() {
      lastMapDragAt = Date.now()
      abortFeatureInfoRequest()
    }

    function handleMapPointerUp(event) {
      if (pointerDownPixel && event.pixel && pixelDistance(pointerDownPixel, event.pixel) > featureInfoDragTolerancePx) {
        lastMapDragAt = Date.now()
      }

      pointerDownPixel = null
    }

    function handleFeatureInfoClick(event) {
      if (Date.now() - lastMapDragAt < featureInfoDragDelayMs) {
        return
      }

      requestFeatureInfo(event.coordinate)
    }

    function pixelDistance(a, b) {
      const dx = a[0] - b[0]
      const dy = a[1] - b[1]
      return Math.sqrt(dx * dx + dy * dy)
    }

    function renderFeatureInfo(body) {
      if (currentInfoFormat.includes('json')) {
        renderGeoJsonInfo(body)
        return
      }

      renderXmlInfo(body)
    }

    function renderGeoJsonInfo(body) {
      let data

      try {
        data = JSON.parse(body)
      } catch {
        featureInfoStatusElement.textContent = 'Reponse GeoJSON invalide'
        featureInfoOutputElement.textContent = body
        return
      }

      const features = Array.isArray(data.features) ? data.features : []
      featureInfoStatusElement.textContent = `${features.length} objet(s) trouve(s) en ${currentInfoFormatLabel}`
      featureInfoOutputElement.textContent = formatFeatureList(features)
    }

    function renderXmlInfo(body) {
      const documentXml = new DOMParser().parseFromString(body, 'application/xml')
      const root = documentXml.documentElement
      const parseError = documentXml.querySelector('parsererror')

      if (parseError) {
        featureInfoStatusElement.textContent = 'Reponse XML invalide'
        featureInfoOutputElement.textContent = body
        return
      }

      const count = root.getAttribute('numberReturned') || '0'
      featureInfoStatusElement.textContent = `${count} objet(s) trouve(s) en ${currentInfoFormatLabel}`
      featureInfoOutputElement.textContent = formatXml(body)
    }

    function formatFeatureList(features) {
      if (features.length === 0) return 'Aucun resultat'

      return features.map((feature, index) => {
        const lines = [`#${index + 1}`]

        if (feature.layer) lines.push(`Couche: ${feature.layer}`)
        if (feature.id !== undefined) lines.push(`ID: ${feature.id}`)

        const properties = feature.properties && typeof feature.properties === 'object'
          ? Object.entries(feature.properties)
          : []

        if (properties.length > 0) {
          lines.push('Proprietes:')
          for (const [name, value] of properties) {
            lines.push(`  ${name}: ${formatValue(value)}`)
          }
        }

        if (feature.geometry && feature.geometry.type) {
          lines.push(`Geometrie: ${feature.geometry.type}`)
        }

        return lines.join('\n')
      }).join('\n\n')
    }

    function formatValue(value) {
      if (value === null || value === undefined) return ''
      if (typeof value === 'string') return value
      if (typeof value === 'number' || typeof value === 'boolean') return String(value)
      return JSON.stringify(value)
    }

    function formatXml(xml) {
      const compact = xml.replace(/>\s+</g, '><')
      const parts = compact.split(/(?=<)/g).filter(Boolean)
      let indent = 0

      return parts.map((part) => {
        if (/^<\//.test(part)) {
          indent = Math.max(0, indent - 1)
        }

        const line = `${'  '.repeat(indent)}${part}`

        if (/^<[^!?/][^>]*[^/]?>$/.test(part) && !part.includes('</')) {
          indent += 1
        }

        return line
      }).join('\n')
    }

    function clearFeatureInfo() {
      abortFeatureInfoRequest()

      featureInfoStatusElement.textContent = currentService === 'wms'
        ? 'Aucune selection'
        : 'GetFeatureInfo disponible uniquement en WMS'
      featureInfoUrlElement.textContent = 'En attente...'
      featureInfoOutputElement.textContent = 'Aucun resultat'
    }

    for (const button of serviceButtons) {
      button.addEventListener('click', () => setService(button.dataset.service))
    }

    for (const button of projectionButtons) {
      button.addEventListener('click', () => setProjection(button.dataset.projection))
    }

    for (const button of formatButtons) {
      button.addEventListener('click', () => setWorldLayer(button.dataset.worldLayer, button.dataset.formatLabel))
    }

    for (const button of tilesetButtons) {
      button.addEventListener('click', () => setTileset(button.dataset.tileset))
    }

    for (const button of infoFormatButtons) {
      button.addEventListener('click', () => setInfoFormat(button.dataset.infoFormat, button.dataset.infoFormatLabel))
    }

    map.on('pointerdown', handleMapPointerDown)
    map.on('pointerdrag', handleMapPointerDrag)
    map.on('pointerup', handleMapPointerUp)
    map.on('singleclick', handleFeatureInfoClick)
    map.once('postrender', () => {
      updateRequestUrl()
      updateScaleReadout()
    })
    map.on('moveend', updateRequestUrl)
    map.on('moveend', updateScaleReadout)

    syncServiceControls()
    updateProjectionSummary()
    clearFeatureInfo()
    updateScaleReadout()
    updateRequestUrl()
  </script>
</body>
</html>
