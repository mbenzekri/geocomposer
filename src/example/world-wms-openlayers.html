<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenLayers WMS Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --line: #d7dee8;
      --text: #172033;
      --muted: #5c6b7a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .meta {
      margin: 12px 0 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .map-shell {
      width: 1000px;
      max-width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    #map {
      width: 100%;
      height: 500px;
    }

    .request {
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    code {
      font-family: Consolas, Monaco, monospace;
    }
  </style>
</head>
<body>
  <main>
    <h1>WMS OpenLayers</h1>
    <p>Vue EPSG:4326, emprise monde, surface 1000 x 500 px.</p>
    <div class="meta"><code>http://localhost:3000/wms</code></div>

    <div class="map-shell">
      <div id="map" aria-label="Carte du monde"></div>
    </div>

    <div class="request">
      <div><strong>Derniere requete WMS</strong></div>
      <code id="request-url">En attente...</code>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
  <script>
    const wmsUrl = 'http://localhost:3000/wms'
    const worldExtent = [-180, -90, 180, 90]

    const source = new ol.source.ImageWMS({
      url: wmsUrl,
      params: {
        SERVICE: 'WMS',
        VERSION: '1.3.0',
        REQUEST: 'GetMap',
        LAYERS: 'world',
        STYLES: '',
        FORMAT: 'image/png',
        TRANSPARENT: true
      },
      ratio: 1,
      serverType: 'mapserver'
    })

    const layer = new ol.layer.Image({
      source
    })

    const map = new ol.Map({
      target: 'map',
      layers: [layer],
      view: new ol.View({
        projection: 'EPSG:4326',
        extent: worldExtent,
        center: [0, 0],
        zoom: 1
      })
    })

    function updateRequestUrl() {
      const size = map.getSize()
      if (!size) return

      const extent = map.getView().calculateExtent(size)
      const projection = map.getView().getProjection()
      const requestUrl = source.getUrl()
      const request = source.getImageLoadFunction()

      const image = source.getImage(extent, map.getView().getResolution(), window.devicePixelRatio, projection)
      const imageUrl = image && image.getImage ? image.getImage().src : ''

      document.getElementById('request-url').textContent = imageUrl || requestUrl || String(request)
    }

    map.once('postrender', updateRequestUrl)
    map.on('moveend', updateRequestUrl)
    source.on('imageloadend', updateRequestUrl)
    source.on('imageloaderror', updateRequestUrl)

    map.updateSize()
    map.getView().fit(worldExtent, {
      size: map.getSize()
    })
  </script>
</body>
</html>
