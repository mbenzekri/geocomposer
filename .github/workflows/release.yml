name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package release
        run: |
          ARCHIVE="geo-composer-${GITHUB_REF_NAME}.tar.gz"

          mkdir release

          cp -R dist release/
          cp package.json release/
          cp package-lock.json release/
          cp src/config/config.schema.json release/
          cp src/style/dynstyle.schema release/

          tar czf "$ARCHIVE" -C release .

          rm -rf release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: geo-composer-${{ github.ref_name }}.tar.gz